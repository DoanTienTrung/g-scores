name: g-scores
services: 
  postgres:
    image: postgres:16-alpine
    container_name: gscores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gscores
      POSTGRES_PASSWORD: gscores
      POSTGRES_DB: gscores
    ports:
      - "5433:5432"
    volumes:
      - gscores-pgdata:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U gscores -d gscores"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gscores-pgdata:

